version: '3.8'

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "1433:1433"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  backend:
    build: .
    ports:
      - "80:80"
    environment:
      # Overrides ConnectionStrings:DefaultConnection in appsettings.json
      - ConnectionStrings__DefaultConnection=Server=database;Database=EcommerceDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      
      # Overrides JwtSettings:Key
      - JwtSettings__Key=${JWT_KEY}
      
      # Overrides BakongSettings:Token
      - BakongSettings__Token=${BAKONG_TOKEN}
      
      # Overrides Telegram:BotToken
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      
      - Redis__ConnectionString=redis:6379
    depends_on:
      - database
      - redis