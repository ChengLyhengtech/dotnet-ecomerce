services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "1433:1433"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  backend:
    build: .
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=database;Database=EcommerceDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__RedisConnection=redis:6379
      - JwtSettings__Key=${JWT_KEY}
      - BakongSettings__Token=${BAKONG_TOKEN}
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
    depends_on:
      - database
      - redis